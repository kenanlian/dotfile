name: development-workflow
version: "0.3.0"
description: >-
  Development Workflow Harness v3: development-stage.v2 card contract, Guard v2
  lineage, ten Origin/Worker tools including review-owned execute UI acceptance
  and exact-SHA candidate publication, and a fail-closed pre_tool_call safety
  net. Enforces Origin, Implement Worker, Review Worker, and non-owning roles.
  Standalone plugin-only surface; no Hermes core patch. Temporary
  kanban_finalize_intent remains for development-task.v1 drafts.
author: Kenan
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - kanban_finalize_intent
  - devflow_create_feature
  - devflow_record_decision
  - devflow_finalize_stage
  - devflow_inspect
  - devflow_start_or_inspect_relay
  - devflow_ui_lease
  - devflow_implement_handoff
  - devflow_review_verdict
  - devflow_publish_candidate
provides_hooks:
  - pre_tool_call
