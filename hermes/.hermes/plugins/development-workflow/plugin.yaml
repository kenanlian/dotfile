name: development-workflow
version: "0.2.2"
description: >-
  Development Workflow Harness v2: development-stage.v2 card contract, Guard v2
  lineage, eight Origin/Worker devflow tools, and a fail-closed pre_tool_call
  safety net. Enforces Origin, Implement Worker, Review Worker, and non-owning
  roles. Standalone plugin-only surface; no Hermes core patch. Temporary
  kanban_finalize_intent remains for development-task.v1 drafts.
author: Kenan
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - kanban_finalize_intent
  - devflow_create_feature
  - devflow_record_decision
  - devflow_finalize_stage
  - devflow_inspect
  - devflow_start_or_inspect_relay
  - devflow_ui_lease
  - devflow_implement_handoff
  - devflow_review_verdict
provides_hooks:
  - pre_tool_call
